[workspace]
members = [
  "crates/common",
  "crates/pe",
  "crates/trace",
  "crates/runtime",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "1.0.69"
log = "0.4.27"
env_logger = "0.11.8"
clap = { version = "4.5.39", features = ["derive"] }